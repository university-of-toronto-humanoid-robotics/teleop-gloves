[project]
name = "teleop-gloves"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "mediapipe>=1.2.3,<2",
    "numpy",
    "opencv-contrib-python",
]

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "mujoco>=3.4,<4",
    "pyright[nodejs]>=1.1.414",
]
[tool.basedpyright]
extends = "pyrightconfig.json"
reportAny = "error"
reportExplicitAny = "error"
